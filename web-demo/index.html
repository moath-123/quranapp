<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المصحف">
<meta name="theme-color" content="#f3ece0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>مصحف — نموذج تجريبي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device" id="device">

  <!-- شاشة التحميل: تحاكي QuranApi.initialize() -->
  <div class="splash" id="splash">
    <div class="splash-mark">﴿ ﴾</div>
    <div class="splash-title">القرآن الكريم</div>
    <div class="splash-bar"><span id="splashBar"></span></div>
  </div>

  <!-- ============ الفهرس ============ -->
  <section class="screen" id="screen-index">
    <div class="scroll">
      <header class="large-title">
        <div>
          <h1>القرآن الكريم</h1>
          <div class="sub">مصحف المدينة · ٦٠٤ صفحة</div>
        </div>
        <button class="glass circle" id="openSdk" aria-label="مختبر الـSDK">
          <svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>
        </button>
      </header>

      <button class="hero" id="continueCard">
        <div class="hero-top">
          <span class="hero-label">متابعة القراءة</span>
          <span class="hero-go"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span>
        </div>
        <div class="hero-title" id="continueTitle">سورة الفاتحة</div>
        <div class="hero-meta" id="continueMeta">صفحة ١</div>
        <div class="hero-progress"><span id="continueBar"></span></div>
      </button>

      <div class="glass segmented" role="tablist">
        <button class="seg active" data-seg="suras">السور</button>
        <button class="seg" data-seg="juz">الأجزاء</button>
      </div>
      <ul class="card list" id="suraList"></ul>
      <ul class="card list" id="juzList" hidden></ul>
    </div>
  </section>

  <!-- ============ المصحف (QuranPageView) ============ -->
  <section class="screen reader" id="screen-reader" hidden>
    <div class="pager" id="pager" dir="rtl"></div>

    <header class="reader-bar">
      <button class="glass circle" id="viewBtn" aria-label="خيارات العرض">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>
      </button>
      <button class="glass reader-info" id="readerInfo">
        <span id="rSurah">الفاتحة</span>
        <span class="sep"></span>
        <span class="juz" id="rJuz">آلم</span>
      </button>
      <div class="glass circle page-badge" id="rPage">١</div>
    </header>

    <div class="glass wird-banner" id="wirdBanner" hidden>
      <span class="pulse"></span>
      <span class="wb-text" id="wirdBannerText"></span>
      <button id="wirdBannerCancel">إلغاء</button>
    </div>

    <button class="glass circle nav-arrow next" id="nextBtn" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="glass circle nav-arrow prev" id="prevBtn" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </section>

  <!-- ============ الورد ============ -->
  <section class="screen" id="screen-wird" hidden>
    <div class="scroll">
      <header class="large-title"><div><h1>الورد</h1><div class="sub">سجّل ما قرأته من آية إلى آية</div></div></header>
      <div id="wirdContent"></div>
    </div>
  </section>

  <!-- ============ المفضلة ============ -->
  <section class="screen" id="screen-bookmarks" hidden>
    <div class="scroll">
      <header class="large-title"><div><h1>المفضلة</h1></div></header>
      <div id="bookmarkContent"></div>
    </div>
  </section>

  <!-- ============ البحث ============ -->
  <section class="screen" id="screen-search" hidden>
    <div class="scroll">
      <header class="large-title"><div><h1>البحث</h1></div></header>
      <label class="glass search-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="searchInput" placeholder="كلمة من آية أو رقم صفحة" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="search-meta" id="searchMeta"></div>
      <div id="results"></div>
    </div>
  </section>

  <!-- ============ مختبر الـSDK (SdkApiTestActivity) ============ -->
  <section class="screen" id="screen-api" hidden>
    <div class="scroll">
      <header class="large-title">
        <div><h1>مختبر QuranApi</h1><div class="sub">جرّب دوال الـSDK وشوف البيانات الراجعة</div></div>
        <button class="glass circle" id="closeSdk" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </header>
      <div id="apiList"></div>
    </div>
  </section>

  <!-- ============ الأوراق السفلية ============ -->
  <div class="backdrop" id="backdrop"></div>

  <div class="bsheet" id="ayahSheet" role="dialog" aria-label="الآية">
    <div class="grabber"></div>
    <div class="as-head">
      <div>
        <div class="as-title" id="asTitle"></div>
        <div class="as-sub" id="asSub"></div>
      </div>
      <button class="close-btn" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="as-text" id="asText"></div>
    <div id="asPrimary"></div>
    <div class="as-actions">
      <button class="as-action" data-act="bookmark"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg><span id="asBmLabel">مفضلة</span></button>
      <button class="as-action" data-act="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>نسخ</span></button>
      <button class="as-action" data-act="share"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span>مشاركة</span></button>
    </div>
  </div>

  <div class="bsheet" id="viewSheet" role="dialog" aria-label="خيارات العرض">
    <div class="grabber"></div>
    <div class="as-head">
      <div class="as-title">العرض والتنقل</div>
      <button class="close-btn" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="vs-group">
      <div class="vs-label">طريقة العرض</div>
      <div class="segmented inner" id="modeSeg">
        <button class="seg" data-mode="mushaf">مصحف المدينة</button>
        <button class="seg" data-mode="text">نص عثماني</button>
      </div>
    </div>
    <div class="vs-group">
      <div class="vs-label">الانتقال إلى صفحة <b id="sliderVal">١</b></div>
      <input type="range" id="pageSlider" min="1" max="604" value="1" dir="rtl" aria-label="الانتقال إلى صفحة">
    </div>
    <div class="vs-group" id="fontGroup">
      <div class="vs-label">حجم الخط</div>
      <div class="stepper">
        <button id="fontDown" aria-label="تصغير">أ−</button>
        <span id="fontVal">٢٤</span>
        <button id="fontUp" aria-label="تكبير">أ+</button>
      </div>
    </div>
  </div>

  <div class="glass toast" id="toast"></div>

  <!-- ============ شريط التبويب العائم ============ -->
  <nav class="tabbar-wrap">
    <div class="glass tabbar">
      <button class="tab active" data-tab="index">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>الفهرس</span>
      </button>
      <button class="tab" data-tab="reader">
        <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5V20"/></svg><span>المصحف</span>
      </button>
      <button class="tab" data-tab="wird">
        <svg viewBox="0 0 24 24"><path d="M5 19V9M10 19V5M15 19v-7M20 19v-4"/></svg><span>الورد</span>
      </button>
      <button class="tab" data-tab="bookmarks">
        <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg><span>المفضلة</span>
      </button>
    </div>
    <button class="glass tab-search" data-tab="search" aria-label="البحث">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
  </nav>
</div>

<script src="data.js"></script>
<script src="page-rects.js"></script>
<script src="quran-api.js"></script>
<script src="app.js"></script>
</body>
</html>
