name: Laravel kit

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/laravel-kit.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Fresh Laravel app with Sanctum
        run: |
          composer create-project laravel/laravel app --prefer-dist --no-interaction --quiet
          cd app
          php artisan --version
          php artisan install:api --no-interaction

      - name: Install the kit (twice, to check it is idempotent)
        run: |
          bash server/laravel-kit/install.sh app
          bash server/laravel-kit/install.sh app
          test "$(grep -c "quran.php" app/routes/api.php)" = "1"

      - name: Migrate and test
        working-directory: app
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          php artisan migrate --force --no-interaction
          php artisan route:list --path=api/quran
          php artisan test --filter=Quran --log-junit junit.xml
          # Guard against a filter that silently matches nothing.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot()
          tests = sum(int(s.get("tests", 0)) for s in suite.iter("testsuite") if s.get("file"))
          failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suite.iter("testsuite") if s.get("file"))
          print(f"quran tests: {tests}, failures: {failures}")
          assert tests >= 15 and failures == 0, "expected at least 15 passing Quran tests"
          PY
