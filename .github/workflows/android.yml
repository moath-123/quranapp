name: Android SDK

on:
  push:
    paths:
      - "quranapp-main/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: quranapp-main

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build SDK and demo app, unit tests, lint
        run: bash gradlew --no-daemon :quran-sdk:assembleRelease :quran-sdk:testDebugUnitTest :quran-sdk:lintDebug :app:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: quranapp-main/quran-sdk/build/reports/

  instrumented-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level == 35 && 'google_apis' || 'default' }}
          disable-animations: true
          working-directory: quranapp-main
          script: bash gradlew --no-daemon :quran-sdk:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: quranapp-main/quran-sdk/build/reports/androidTests/
